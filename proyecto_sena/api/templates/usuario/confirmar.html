<!-- Indica que esta plantilla hereda de la plantilla usuario/index.html-->
{% extends 'usuario/index.html' %}

<!-- Indica el inicio del bloque -->
{% block content %}

<form method="post">
    <!-- {% csrf_token %} genera un token de seguridad para proteger el formulario contra ataques de tipo CSRF (Cross-Site Request Forgery).-->
    {% csrf_token %}
    <p>Elimiar el usuario <strong>{{ object.nombre }}</strong></p>
    <button type="submit">Eliminar</button>
    <a href="{% url 'listar_usuario' %}">Cancelar</a>
</form>

{% endblock %}
